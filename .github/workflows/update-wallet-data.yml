name: Update Wallet Data

on:
  schedule:
    - cron: '17 0,5,10,15,20 * * *'  # about every 5 hours; one 4-hour gap daily (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-data-writers
  cancel-in-progress: false

jobs:
  update-wallet-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch wallet data
        id: fetch_wallet
        run: node scripts/fetch-wallet-data.mjs --incremental

      - name: Commit and push if changed
        # Publish an independently valid receipt update even if other history fails.
        # The failed collector still leaves this workflow failed.
        if: ${{ always() && steps.fetch_wallet.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/wallet.json
          if [ -f src/_data/walletObservation.json ]; then
            git add src/_data/walletObservation.json
          fi
          if [ -f src/_data/wethReceipts.json ]; then
            git add src/_data/wethReceipts.json
          fi
          git diff --staged --quiet && echo "No changes to wallet data." || (
            git commit -m "chore: update wallet data $(date -u +%Y-%m-%d)" &&
            git pull --rebase origin main &&
            git push
          )
